name: Content correction
description: A question, answer, sign or rule is wrong or outdated
title: "[Content] "
labels: ["content"]
body:
  - type: input
    id: where
    attributes:
      label: Where is it?
      description: Lesson name, sign number (e.g. W332) or the question text
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What's wrong
    validations:
      required: true
  - type: textarea
    id: correct
    attributes:
      label: What it should say
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: Link or reference (e.g. NRTA regulation, SADC-RTSM, official licensing department page)
    validations:
      required: true
